# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

# Trigger logic has been spun out into the various 'ci_trigger_*.yml' workflows.

name: 'CI: Create Build Artifact'
run-name: 'Create build artifact for ${{inputs.title-source}}: "${{inputs.title-header}}"'

on:
  workflow_call:
    inputs:
      config-id:
        description: 'ID for a GitHub artifact containing a JSON configuration file.'
        required: true
        type: string
      title-source:
        description: 'Human-readable identifier for input source. Only used for run-name.'
        required: false
        default: '?'
        type: string
      title-header:
        description: 'Human-readable commit header for input source. Only used for run-name.'
        required: false
        default: '?'
        type: string
    outputs:
      build-id:
        description: 'ID for the GitHub build artifact output by this file.'
        value: ${{ jobs.build.outputs.build-id }}
      metadata-id:
        description: 'ID for a GitHub artifact containing the metadata for this build.'
        value: ${{ jobs.build.outputs.metadata-id }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    permissions:
      artifact-metadata: write
      deployments: write
      metadata: read
      secrets: read # Note: implicitly will not be provided for foreign pull requests
      variables: read
    outputs:
      build-id: ${{ steps.upload-build.outputs.artifact-id }}
      metadata-id: ${{ steps.upload-metadata.outputs.artifact-id }}

    steps:
    - name: Download config payload
      uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ inputs.config-id }}
        path: payloads/build_config.json

    - name: Extract payload inputs
      id: extract_json
      run: |
        payload='cat ./payloads/build_config.json'
        echo "::set-output name=payloadJson::$payload"
      run: |
        echo "DEPLOY_ENV=${{ fromJson(steps.extract_json.outputs.payloadJson).deploy_env }}" >> $GITHUB_ENV
        echo "TARGET_REPO=${{ fromJson(steps.extract_json.outputs.payloadJson).target_repo }}" >> $GITHUB_ENV
        echo "TARGET_PATH=${{ fromJson(steps.extract_json.outputs.payloadJson).target_path }}" >> $GITHUB_ENV
        echo "COMMIT_HEADER=${{ fromJson(steps.extract_json.outputs.payloadJson).commit_header }}" >> $GITHUB_ENV
        echo "PR_NUMBER=${{ fromJson(steps.extract_json.outputs.payloadJson).pr_number }}" >> $GITHUB_ENV
      # PR_NUMBER can and should be left empty for non-PR builds
      
    - name: Validate payload inputs
      run: |
        if ![["$DEPLOY_ENV" = "production"] || ["$DEPLOY_ENV" = "staging"] || ["$DEPLOY_ENV" = "pr-staging"]]; then
          echo "Invalid DEPLOY_ENV value '$DEPLOY_ENV'. Expected 'production', 'staging', or 'pr-staging'."
          exit 1
        fi
    
    - name: Generate base URL
      run: |
        if ["$TARGET_PATH" != "."]; then
          echo "BASE_URL=/$TARGET_PATH" >> $GITHUB_ENV
        else
          echo "BASE_URL=/" >> $GITHUB_ENV
        fi

    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.client_payload.source_ref }}
        repository: ${{ github.event.client_payload.source_repo }}
        # Note: allow-unsafe-pr-checkout left unset to ensure that
        # any branch checkouts are only done on calls from pull_request.

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Generate version
      id: version
      run: |
        version=$(date +'%Y%m%d-%H%M%S')
        echo "VERSION=${version}" >> $GITHUB_OUTPUT
        echo "VERSION=${version}" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        npm ci
    # If you're here because of an error about dependencies:
    # that issue is most likely because of the `package-lock.json`.
    # Delete `node_modules` and `package-lock.json` on your
    # development environment, then run `npm i` to generate
    # a fresh lock file.
    # See also: https://github.com/npm/cli/issues/4828

    - name: Configure baseUrl
      run: |
        # Create a backup of the original config
        cp docusaurus.config.js docusaurus.config.js.bak
        
        # Use sed to replace the baseUrl value
        echo "Setting baseUrl to path '$BASE_URL'"
        sed -i 's|baseUrl: '\''\/local\/'\''|baseUrl: '\''${{ env.BASE_URL }}'\''|g' docusaurus.config.js
        sed -i 's|baseUrl: "\/local\/"|baseUrl: '\''${{ env.BASE_URL }}'\''|g' docusaurus.config.js
        sed -i 's|baseUrl = '\''\/local\/'\''|baseUrl = '\''${{ env.BASE_URL }}'\''|g' docusaurus.config.js
        sed -i 's|baseUrl = "\/local\/"|baseUrl = '\''${{ env.BASE_URL }}'\''|g' docusaurus.config.js
        
        # Show the changed config
        config_out="$(cat docusaurus.config.js | head -n 10)"
        echo "Modified docusaurus.config.js (first 10 lines):"
        echo "${config_out}"

    # Build the site
    - name: Build website
      run: npm run build
      env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_CIROH_GROUP_ID: ${{ secrets.ZOTERO_CIROH_GROUP_ID }}
          ZOTERO_STAGING_API_KEY: ${{ secrets.ZOTERO_STAGING_API_KEY }}
          ZOTERO_CIROH_STAGING_GROUP_ID: ${{ secrets.ZOTERO_CIROH_STAGING_GROUP_ID }}
          CAPTCHA_KEY: ${{ secrets.CAPTCHA_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          HS_CLIENT_ID: ${{ secrets.HS_CLIENT_ID }}
          HS_FEATURED_APPS_COLLECTION_ID: ${{ vars.HS_FEATURED_APPS_COLLECTION_ID }}
          HS_FEATURED_DATASETS_COLLECTION_ID: ${{ vars.HS_FEATURED_DATASETS_COLLECTION_ID }}
          HS_FEATURED_COURSES_COLLECTION_ID: ${{ vars.HS_FEATURED_COURSES_COLLECTION_ID }}
          HS_FEATURED_PRESENTATIONS_COLLECTION_ID: ${{ vars.HS_FEATURED_PRESENTATIONS_COLLECTION_ID }}
          HS_FEATURED_NOTEBOOKS_COLLECTION_ID: ${{ vars.HS_FEATURED_NOTEBOOKS_COLLECTION_ID }}
          GH_PROJECT_TOKEN: "deprecated"
        
    - name: Upload a Build Artifact
      id: upload-build
      uses: actions/upload-artifact@v8
      with:
        # Artifact name
        name: build-${{ env.DEPLOY_ENV }}${{ env.PR_NUMBER }}
        # A file, directory or wildcard pattern that describes what to upload
        path: build/

    - name: Create release
      if: ${{ env.DEPLOY_ENV == 'production' }}
      uses: actions/create-release@v1
      id: create_release
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
          tag_name: v${{env.VERSION}}
          release_name: Release v${{env.VERSION}}
          draft: false
          prerelease: false

    # Get short SHA
    - name: Get short SHA
      id: short-sha
      run: echo "SHORT_SHA=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_OUTPUT
    
    # Write build metadata to JSON file
    - name: Output build metadata
      id: define-metadata
      run: |
        {"deploy_env": "${{ env.DEPLOY_ENV }}", "version": "${{ env.VERSION }}", "target_repo": "${{ env.TARGET_REPO }}", "target_path": "${{ env.TARGET_PATH }}", "short_hash": "${{ steps.short-sha.outputs.SHORT_SHA }}", "commit_hash": "${{ github.sha }}", "commit_header": "${{ env.COMMIT_HEADER }}", "branch": "${{ github.ref_name }}", "pr_number": "${{ env.PR_NUMBER }}"} > exports/build_${{ env.DEPLOY_ENV }}${{ env.PR_NUMBER }}_metadata.json
        echo exports/build_${{ env.DEPLOY_ENV }}${{ env.PR_NUMBER }}_metadata.json
    - name: Upload a Build Artifact
      id: upload-metadata
      uses: actions/upload-artifact@v8
      with:
        # Artifact name
        name: build-metadata-${{ env.DEPLOY_ENV }}${{ env.PR_NUMBER }}
        # A file, directory or wildcard pattern that describes what to upload
        path: metadata/metadata.json
