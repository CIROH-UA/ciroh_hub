# Security posture: supporting PRs in staging requires running and deploying untrusted code.
# However, by limiting deployments to the `/staging/pr` subdirectory via this workflow,
# we minimize the potential attack surface to a known subset of pages.

name: 'CD: Receive PR build artifact'
run-name: 'CD: Confirm PR deployment safety'

on:
  workflow_run:
    workflows: ['CI: Trigger deployment from PR']
    types:
      - completed

jobs:
  extract-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      params-id: $PARAMS-ID
      title-header: ${{ steps.fetch-commit-header.outputs.header }}
      title-source: ${{ steps.set-deployment-target.outputs.source }}
      title-dest: ${{ steps.set-deployment-target.outputs.destination }}
    steps:
    - name: Download config payload
      uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ inputs.config-id }}
        path: payloads/build_config.json

    - name: TODO
      run: echo TODO

  call-deployment:
    runs-on: ubuntu-latest
    needs: extract-config
    # TODO: Permissions
    steps:
    - name: Call deployment workflow
      uses: ./.github/workflows/cd_deploy_composite.yml
      with:
        build-id: ${{ needs.extract-config.outputs.build-id }}
        metadata-id: ${{ needs.extract-config.outputs.metadata-id }}
        title-source: ${{ needs.extract-config.outputs.title-source }}
        title-header: ${{ needs.extract-config.outputs.title-dest }}
  
  notify:
    # if: true # TODO
    runs-on: ubuntu-latest
    needs: extract-config
    steps:
    - name: Comment PR with staging link
      uses: mshick/add-pr-comment@v2
      with:
        message: |
          **Staging Preview:**
          🚀 https://hub.ciroh.org/staging/${{ github.event.number }}
          _Will be live within ~10 minutes of this message_
            
          _Built from commit ${{ github.sha }}_
        # TODO: Replace these with content from payload
