# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: 'Callable: Deploy build artifact to composite target'
run-name: 'Deploy to composite target: ${{ github.event.inputs.title-source }} ➡️ ${{ github.event.inputs.title-dest }}'

on:
  workflow_call:
    inputs:
      build-id:
        required: true
        type: string
      build-run-id:
        required: true
        type: string
      metadata-id:
        required: true
        type: string
      title-source:
        required: false
        type: string
        default: '?'
      title-dest:
        required: false
        type: string
        default: '?'

concurrency:
  group: "deploys-to-remote"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      payload: ${{ steps.extract-json.outputs.environment }}
      version: ${{ steps.extract-json.outputs.version }}
    permissions:
      contents: write # To tag and create a new release
      actions: write
    name: Deploy to remote
    steps:
      # Mostly for the sake of the deploy action, which assumes a git directory is present
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: 'blob:none' # only retrieve metadata
      
      # Get config payload
      - name: Download config payload
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.metadata-id }}
          path: ${{ runner.temp }}/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Get environment, version, etc from config payload
      - name: Unpack payload inputs
        id: extract-json
        run: |
          payload=`cat ${{ runner.temp }}/build_metadata.json`
          echo "payload_json=$payload" >> $GITHUB_OUTPUT
      
      - name: Parse payload inputs
        env:
          TEMP_ENV: ${{ fromJson(steps.extract-json.outputs.payload_json).deploy_env }}
          TEMP_VER: ${{ fromJson(steps.extract-json.outputs.payload_json).version }}
          TEMP_TR: ${{ fromJson(steps.extract-json.outputs.payload_json).target_repo }}
          TEMP_TP: ${{ fromJson(steps.extract-json.outputs.payload_json).target_path }}
          TEMP_NUM: ${{ fromJson(steps.extract-json.outputs.payload_json).pr_number }}
          TEMP_HASH: ${{ fromJson(steps.extract-json.outputs.payload_json).commit_hash }}
          TEMP_HEADER: ${{ fromJson(steps.extract-json.outputs.payload_json).commit_header }}
          TEMP_BRANCH: ${{ fromJson(steps.extract-json.outputs.payload_json).branch }}
        run: |
          echo "DEPLOY_ENV=$TEMP_ENV" >> $GITHUB_ENV
          echo "VERSION=$TEMP_VER" >> $GITHUB_ENV

          echo "TARGET_REPO=$TEMP_TR" >> $GITHUB_ENV
          echo "TARGET_PATH=$TEMP_TP" >> $GITHUB_ENV
          echo "PR_NUMBER=$TEMP_NUM" >> $GITHUB_ENV

          echo "COMMIT_HASH=$TEMP_HASH" >> $GITHUB_ENV
          echo "COMMIT_HEADER=$TEMP_HEADER" >> $GITHUB_ENV
          echo "BRANCH=$TEMP_BRANCH" >> $GITHUB_ENV

          echo "environment=$TEMP_ENV" >> $GITHUB_OUTPUT
          echo "version=$TEMP_VER" >> $GITHUB_OUTPUT

      - name: Echo inputs from payload
        run: |
          echo "Deploying commit $COMMIT_HASH"
          echo "Commit header: $COMMIT_HEADER"
          echo "Branch: $BRANCH"
          echo "Deploying version: $VERSION"
          echo "Environment: $DEPLOY_ENV"
          echo "Deploy target: /$TARGET_PATH @ $TARGET_REPO"

      - name: Create release
        if: ${{ env.DEPLOY_ENV == 'production' }}
        uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{env.VERSION}}
          release_name: Release v${{env.VERSION}}
          draft: false
          prerelease: false
          
      - name: Download a Build Artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.build-id }}
          path: build/
          run-id: ${{ inputs.build-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to composite repository
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          ssh-key: ${{ secrets.SSH_DEPLOY_HUB_SUBDOMAIN }}
          repository-name: ${{ env.TARGET_REPO }}
          target-folder: ${{ env.TARGET_PATH }}
          clean: $DEPLOY_ENV == 'production' # Set to false if deploying to a composite repository's root!
          git-config-name: "github-actions"
          git-config-email: "github-actions@github.com"

      - name: Post-deployment notification
        run: |
          if [[ "${{ env.DEPLOY_ENV }}" == "production" ]]; then
            echo "### Production build artifact uploaded! 🚀" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ env.DEPLOY_ENV }}" == "staging-pr" ]]; then
            echo "### Staging build artifact uploaded for PR #${{ env.PR_NUMBER }}! 🚀" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Staging build artifact uploaded! 🚀" >> $GITHUB_STEP_SUMMARY
            echo "To deploy to production, manually trigger the 'CI: Trigger staging deployment from main' workflow." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: $DEPLOY_ENV" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deploy Target**: ${{ env.TARGET_PATH }} @ ${{ env.TARGET_REPO }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL (once live)**: https://hub.ciroh.org${{ env.BASE_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployment to GitHub Pages will be completed by the composite target repository, $TARGET_REPO." >> $GITHUB_STEP_SUMMARY