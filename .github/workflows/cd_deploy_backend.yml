name: Deploy CIROH Hub Backend

on:
  push:
    branches: [main]
    paths:
      - 'ciroh-hub-backend/**'
      - '.github/workflows/cd_deploy_backend.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ciroh-hub-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_PIPELINE_EXECUTION_ROLE }}
          role-session-name: github-actions-backend-deploy

      - name: SAM build
        run: sam build

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name ${{ vars.AWS_STACK_NAME }} \
            --capabilities CAPABILITY_IAM \
            --s3-bucket ${{ secrets.AWS_ARTIFACTS_BUCKET }} \
            --role-arn ${{ secrets.AWS_CLOUDFORMATION_EXECUTION_ROLE }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region ${{ vars.AWS_REGION }} \
            --parameter-overrides \
              AllowedOrigin=https://hub.ciroh.org \
              AllowedRecaptchaHosts=hub.ciroh.org \
              RecaptchaSecretKey=${{ secrets.RECAPTCHA_SECRET_KEY }} \
              ZoteroApiKey=${{ secrets.ZOTERO_API_KEY }} \
              ZoteroStagingGroupId=${{ secrets.ZOTERO_CIROH_STAGING_GROUP_ID }}
