<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Policies and best practices illustration">
  <defs>
    <linearGradient id="exPolShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- soft backdrop -->
  <circle cx="200" cy="165" r="134" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="86" cy="72" r="9" fill="#60a5fa" opacity="0.8"/>
  <circle cx="326" cy="238" r="8" fill="#19a7ce" opacity="0.8"/>

  <!-- checklist document behind -->
  <g transform="rotate(-8 150 165)">
    <rect x="78" y="74" width="150" height="182" rx="12" fill="#ffffff" stroke="#1e40af" stroke-width="4"/>
    <g>
      <rect x="96" y="100" width="18" height="18" rx="4" fill="#19a7ce"/>
      <path d="M99 109 l5 5 l9 -10" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="124" y="104" width="86" height="9" rx="4.5" fill="#cbd5e1"/>
    </g>
    <g>
      <rect x="96" y="136" width="18" height="18" rx="4" fill="#19a7ce"/>
      <path d="M99 145 l5 5 l9 -10" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="124" y="140" width="86" height="9" rx="4.5" fill="#cbd5e1"/>
    </g>
    <g>
      <rect x="96" y="172" width="18" height="18" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
      <rect x="124" y="176" width="70" height="9" rx="4.5" fill="#e2e8f0"/>
    </g>
    <g>
      <rect x="96" y="208" width="18" height="18" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
      <rect x="124" y="212" width="70" height="9" rx="4.5" fill="#e2e8f0"/>
    </g>
  </g>

  <!-- shield -->
  <g transform="translate(248 168)">
    <path d="M0 -78 L66 -52 V6 C66 46 36 74 0 90 C-36 74 -66 46 -66 6 V-52 Z" fill="url(#exPolShield)" stroke="#1e3a8a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-28 2 l18 20 l40 -46" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- seal / badge -->
  <g transform="translate(300 92)">
    <path d="M0 -22 l6 5 l8 -2 l2 8 l7 5 l-4 8 l4 8 l-7 5 l-2 8 l-8 -2 l-6 5 l-6 -5 l-8 2 l-2 -8 l-7 -5 l4 -8 l-4 -8 l7 -5 l2 -8 l8 2 z" fill="#f59e0b"/>
    <circle cx="0" cy="0" r="9" fill="#fff7ed"/>
    <path d="M-4 0 l3 3 l6 -7" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
